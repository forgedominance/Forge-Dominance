# Nginx cache headers for Hostinger KVM2
# Include this in your nginx server block

# CSS and JS — immutable, versioned via ?v= query param
location ~* \.(?:css|js)$ {
  expires 1y;
  add_header Cache-Control "public, max-age=31536000, immutable";
  add_header X-Content-Type-Options "nosniff";
}

# Images — 30 days
location ~* \.(?:jpg|jpeg|png|gif|webp|svg|ico)$ {
  expires 30d;
  add_header Cache-Control "public, max-age=2592000";
}

# Product uploads — 30 days
location /assets/products/ {
  expires 30d;
  add_header Cache-Control "public, max-age=2592000";
}

location /assets/uploads/ {
  expires 30d;
  add_header Cache-Control "public, max-age=2592000";
}

# API responses — never cache
location /api/ {
  add_header Cache-Control "no-store";
  proxy_pass http://127.0.0.1:5000;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection 'upgrade';
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_cache_bypass $http_upgrade;
}

# Gzip compression (handled at Nginx level, not Node)
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
gzip_min_length 256;
